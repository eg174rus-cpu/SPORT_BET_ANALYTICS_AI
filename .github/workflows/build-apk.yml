name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q SPORT_BET_ANALYTICS_AI_v0.3.0_APK_BUILD_KIT.zip

      - name: Build APK
        run: gradle -p SPORT_BET_ANALYTICS_AI --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SPORT_BET_ANALYTICS_AI-APK
          path: SPORT_BET_ANALYTICS_AI/app/build/outputs/apk/debug/app-debug.apk
